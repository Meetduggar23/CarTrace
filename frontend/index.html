<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14283D" />
    <meta
      name="description"
      content="AutoCheck — check vehicle specifications, registration information and available vehicle records in one place. VIN decoding and RTO directory."
    />
    <title>AutoCheck — Vehicle Information & Registration Checker</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AutoCheck" />
    <meta property="og:title" content="AutoCheck — Vehicle Information & Registration Checker" />
    <meta
      property="og:description"
      content="Check vehicle specifications, registration information and available vehicle records in one place."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Instant branded loading screen shown until React mounts. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #14283d;
        transition: opacity 0.4s ease;
      }
      #boot-splash img {
        width: 210px;
        height: auto;
        max-width: 70vw;
      }
      #boot-splash .splash-spinner {
        width: 26px;
        height: 26px;
        border-radius: 9999px;
        border: 2.5px solid rgba(212, 175, 55, 0.3);
        border-top-color: #d4af37;
        animation: splash-spin 0.9s linear infinite;
      }
      #boot-splash .splash-label {
        font: 500 13px/1.4 Inter, system-ui, -apple-system, sans-serif;
        letter-spacing: 0.02em;
        color: #b3a887;
      }
      #boot-splash.boot-splash--fade {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .splash-spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading AutoCheck">
      <img src="/logo.png" alt="AutoCheck" />
      <div class="splash-spinner" aria-hidden="true"></div>
      <span class="splash-label">Loading AutoCheck…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
